<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Importar Excel - Modalidad 40</title>
</head>
<body>
  <h1>Importar Excel (dd/mm/aaaa)</h1>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <ul>
        {% for category, msg in messages %}
          <li><strong>{{ category }}:</strong> {{ msg }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}
  <form action="{{ url_for('upload') }}" method="post" enctype="multipart/form-data">
    <label>Archivo Excel: <input type="file" name="file" accept=".xls,.xlsx" required></label><br>
    <label>Nombre de hoja (opcional): <input type="text" name="sheet"></label><br>
    <button type="submit">Subir e Importar</button>
  </form>

  <p><a href="{{ url_for('list_persons') }}">Ver registros importados</a></p>
  <p><a href="/data/example.xlsx" download>Descargar ejemplo data/example.xlsx</a></p>
</body>
</html>
